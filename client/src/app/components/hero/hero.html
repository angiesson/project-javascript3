<section class="flex flex-col lg:flex-row">
  <img
    [src]="imageUrl"
    [alt]="title"
    class="w-full h-auto lg:w-1/2 lg:h-96 object-cover"
  >

  <div class="lg:w-1/2 p-6 flex flex-col justify-center">
    <h1 class="text-3xl lg:text-5xl font-semibold">
    {{ title }}
    </h1>

    <p class="mt-4 text-lg">
    {{ description }}
    </p>
  </div>
</section>
