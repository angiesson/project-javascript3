<section class="flex flex-col lg:flex-row px-4 sm:px-6 lg:px-8 mt-6">

  <div class="order-2 lg:order-1 lg:w-2/5 p-6 sm:p-8 lg:p-12 flex flex-col justify-center">
    <h1 class="font-['Cormorant_Garamond'] text-3xl lg:text-5xl font-semibold">
      {{ title }}
    </h1>

    <p class="mt-4 text-lg">
      {{ description }}
    </p>
  </div>

  <img
    [src]="imageUrl"
    [alt]="title"
    class="order-1 lg:order-2 w-full h-auto lg:w-3/5 rounded-sm"
  >

</section>
