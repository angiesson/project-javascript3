<form (submit)="search(); $event.preventDefault()"
class="flex items-center"
>

  <input
    type="text"
    placeholder="Search products"
    [value]="searchTerm()"
    (input)="searchTerm.set($any($event.target).value)"
    class="border border-gray-300 rounded-l-md px-4 py-2 outline-none"
  >

  <button 
  type="submit"
  class="border border-gray-300 border-l-0 rounded-r-md px-4 py-2"
  >
    Search
  </button>
</form>
