<form (submit)="search(); $event.preventDefault()"
class="flex items-center w-full max-w-md bg-transparent border border-[#F0E2B6] rounded-full overflow-hidden focus-within:border-[#F0E2B6] transition-colors"
>

  <input
    type="text"
    placeholder="Search products"
    [value]="searchTerm()"
    (input)="searchTerm.set($any($event.target).value)"
    class="w-full min-w-0 px-4 py-2 text-sm text-[#F0E2B6] placeholder:text-[#F0E2B6]/70 outline-none bg-transparent"
  >

<button
  type="submit"
  aria-label="Search"
  class="self-stretch px-4 flex items-center justify-center text-[#F0E2B6] cursor-pointer hover:bg-white/10 transition-colors"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    class="w-4 h-4"
    aria-hidden="true"
  >
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.35-4.35"></path>
  </svg>
  </button>
</form>
