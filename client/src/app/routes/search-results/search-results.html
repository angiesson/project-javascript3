<main class="max-w-5xl mx-auto px-6 py-10">

<h1 class="text-2xl font-semibold mb-6">
  Search results for: {{ searchTerm() }}
</h1>

@if (products().length > 0) {
    <app-productlist [products]="products()" />
  } @else {
    <p>
      No products found for "{{ searchTerm() }}".
    </p>
  }

</main>
